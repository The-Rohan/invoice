name: Test and package desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
          - os: windows-2022
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Desktop persistence and preview smoke test
        run: node test/desktop.mjs
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mandi-Invoice-${{ matrix.target }}-x64
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
