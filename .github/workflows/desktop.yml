name: Test, build and release desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
            executable: dist/mac/Mandi Invoice.app/Contents/MacOS/Mandi Invoice
          - os: windows-2022
            target: win
            executable: dist/win-unpacked/Mandi Invoice.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Desktop persistence and preview smoke test
        run: node test/desktop.mjs
      - name: Build native installer
        run: npx electron-builder --${{ matrix.target }} ${{ matrix.target == 'mac' && 'dmg zip' || 'nsis zip' }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the packaged application
        run: node test/desktop.mjs
        env:
          MANDI_EXECUTABLE: ${{ matrix.executable }}
      - name: Prepare named download
        run: node scripts/prepare-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mandi-Invoice-${{ matrix.target }}-x64
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: Mandi-Invoice-*-x64
          path: release
          merge-multiple: true
      - name: Verify downloads and write checksums
        run: node scripts/release-checksums.mjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "Mandi Invoice $GITHUB_REF_NAME — desktop preview" --notes-file docs/RELEASE-NOTES.md
